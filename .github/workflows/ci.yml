name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks before it builds a release.
  workflow_call:

# The workflow only reads the repository. Nothing in it needs write access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs, because tags can be moved.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Do not leave the token in .git/config for later steps.
          persist-credentials: false

      # Uses the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Check that actions are pinned to commit SHAs
        run: |
          # Every action from another repository must use a full 40-character commit SHA.
          if grep -nE '^\s*-?\s*uses:' .github/workflows/*.yml | grep -vE '@[0-9a-f]{40}( |$)|uses: \./'; then
            echo "Pin these actions to a full commit SHA, with the version in a comment."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check for dead code and duplication
        run: pnpm fallow:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build for Chrome and Brave
        run: pnpm build

      - name: Build for Firefox
        run: pnpm build:firefox
